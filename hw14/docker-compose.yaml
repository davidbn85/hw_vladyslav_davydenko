services:

  app:
    build: .
    container_name: flask-api

    expose:
      - "8000"

    volumes:
      - ./students.csv:/app/students.csv

    restart: unless-stopped

  nginx:
    image: nginx:latest

    container_name: nginx-proxy

    ports:
      - "8080:80"

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf

    depends_on:
      - app

    restart: unless-stopped